name: 安卓构建与发布
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 编译、静态检查与设备测试
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 配置 Gradle 与校验构建工具
        uses: gradle/actions/setup-gradle@v4
      - name: 编译与静态检查
        run: bash gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon --no-watch-fs
      - name: 启用模拟器硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 在安卓设备验证接口与会话安全
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash gradlew connectedDebugAndroidTest --no-daemon --no-watch-fs
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 安卓测试报告
          path: app/build/reports/
      - name: 保存调试安装包
        uses: actions/upload-artifact@v4
        with:
          name: 校园墙调试安装包
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: 签名构建并发布中文版
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 获取已验证源码
        uses: actions/checkout@v4
      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: 校验版本与发布说明
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$RELEASE_TAG" = "v$VERSION"
          test -s "docs/releases/$RELEASE_TAG.md"
      - name: 恢复专用签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campuswall-release.p12"
          test -s "$RUNNER_TEMP/campuswall-release.p12"
      - name: 构建正式签名安装包
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/campuswall-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew assembleRelease bundleRelease lintRelease --no-daemon --no-watch-fs
      - name: 校验签名并生成校验文件
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Campuswall-$RELEASE_TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Campuswall-$RELEASE_TAG.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/Campuswall-$RELEASE_TAG.apk" > release/signature.txt
          (cd release && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: 发布 GitHub 中文版本
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/Campuswall-$RELEASE_TAG.apk#观澜校园墙 $RELEASE_TAG 安卓安装包" \
            "release/Campuswall-$RELEASE_TAG.aab#观澜校园墙 $RELEASE_TAG 应用分发包" \
            "release/SHA256SUMS.txt#安装包校验和" \
            "release/signature.txt#签名验证报告" \
            --verify-tag --title "观澜校园墙 $RELEASE_TAG · 安卓原生预览版" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --prerelease
      - name: 清理临时签名密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/campuswall-release.p12"
